services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wirefen
      POSTGRES_USER: wirefen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirefen -d wirefen"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_USE_BACKEND: ${NEXT_PUBLIC_USE_BACKEND:-true}
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      NEXT_PUBLIC_USE_BACKEND: ${NEXT_PUBLIC_USE_BACKEND:-true}
      USE_BACKEND: ${NEXT_PUBLIC_USE_BACKEND:-true}
      DATABASE_URL: postgresql://wirefen:${POSTGRES_PASSWORD}@db:5432/wirefen
      APP_ORIGIN: ${APP_ORIGIN:?Set your HTTPS application origin}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set your Clerk publishable key}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set your Clerk secret key}
      MARKET_NAME: ${MARKET_NAME:-South Africa (sample market)}
      CURRENCY: ${CURRENCY:-ZAR}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
